name: doancuoiki
description: "IELTS Vision - App học tiếng Anh 4 kỹ năng tích hợp Nhận diện vật thể AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & DI
  provider: ^6.1.1
  get_it: ^7.6.4
  
  # Camera & AI Vision
  camera: ^0.11.0+1
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  
  # Local Database (SQLite)
  sqflite: ^2.3.2
  path: ^1.9.0
  
  # Text To Speech
  flutter_tts: ^4.0.2
  
  # Local Storage & Auth Simulation
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/data/
